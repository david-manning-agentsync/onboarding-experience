<!-- om-welcome.html — Operating Manager welcome (Onboarding theme) -->
<style>
  #screen-om-welcome .om-shell { height: calc(100vh - 44px); display: flex; flex-direction: column; }

  /* ── SFDC Chrome ── */
  #screen-om-welcome .ms-nav {
    flex-shrink: 0;
    background: var(--color-bg-surface);
    border-bottom: 1px solid var(--color-gray-300);
    display: flex; flex-direction: column; z-index: 200;
  }
  #screen-om-welcome .ms-nav__utility {
    display: flex; align-items: center;
    height: 50px; padding: 0 var(--space-medium); gap: var(--space-small);
    border-bottom: 1px solid var(--color-gray-300);
  }
  #screen-om-welcome .ms-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; text-decoration: none; margin-right: 4px; }
  #screen-om-welcome .ms-nav__search {
    flex: 1; max-width: 480px; margin: 0 auto; height: 32px;
    display: flex; align-items: center;
    border: 1px solid var(--color-gray-300); border-radius: 4px;
    padding: 0 10px; gap: 6px; background: var(--color-bg-surface);
  }
  #screen-om-welcome .ms-nav__search input { flex: 1; border: none; outline: none; font-family: var(--font-family-base); font-size: var(--font-size-sm); color: var(--color-text-primary); background: transparent; }
  #screen-om-welcome .ms-nav__search input::placeholder { color: var(--color-text-muted); }
  #screen-om-welcome .ms-nav__icons { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
  #screen-om-welcome .ms-nav__icon {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer; color: var(--color-gray-600);
    transition: background var(--transition-fast); position: relative;
  }
  #screen-om-welcome .ms-nav__icon:hover { background: var(--color-gray-100); }
  #screen-om-welcome .ms-nav__icon--combo { display: flex; align-items: center; gap: 2px; padding: 0 4px; border-radius: 4px; cursor: pointer; color: var(--color-gray-600); }
  #screen-om-welcome .ms-nav__icon--combo:hover { background: var(--color-gray-100); }
  #screen-om-welcome .ms-nav__badge {
    position: absolute; top: 4px; right: 4px; width: 14px; height: 14px;
    background: var(--color-danger-base); color: #fff; font-size: 9px; font-weight: var(--font-weight-bold);
    border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center;
  }
  #screen-om-welcome .ms-nav__avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--color-primary-600); color: #fff;
    font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
    display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 4px;
  }
  #screen-om-welcome .ms-nav__app { display: flex; align-items: stretch; height: 44px; }
  #screen-om-welcome .ms-nav__waffle {
    display: flex; align-items: center; justify-content: center;
    width: 44px; flex-shrink: 0; color: var(--color-gray-600);
    cursor: pointer; border-right: 1px solid var(--color-gray-300);
  }
  #screen-om-welcome .ms-nav__appname {
    display: flex; align-items: center;
    font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
    color: var(--color-text-primary); white-space: nowrap;
    padding: 0 var(--space-medium); border-right: 1px solid var(--color-gray-300); flex-shrink: 0;
  }
  #screen-om-welcome .ms-nav__tabs { display: flex; align-items: stretch; flex: 1; }
  #screen-om-welcome .ms-nav__tab {
    display: flex; align-items: center; gap: 3px; padding: 0 16px;
    font-size: var(--font-size-sm); color: var(--color-gray-600);
    cursor: pointer; white-space: nowrap;
    border-bottom: 3px solid transparent; transition: color var(--transition-fast); flex-shrink: 0;
  }
  #screen-om-welcome .ms-nav__tab:hover { color: var(--color-text-primary); }
  #screen-om-welcome .ms-nav__tab.active { color: var(--color-brand-500); border-bottom-color: var(--color-brand-500); font-weight: var(--font-weight-semibold); }
  #screen-om-welcome .ms-nav__tab--dim { color: var(--color-text-muted); cursor: default; }
  #screen-om-welcome .ms-nav__caret { font-size: 9px; color: var(--color-gray-400); }
  #screen-om-welcome .ms-nav__tab.active .ms-nav__caret { color: var(--color-brand-300); }

  #screen-om-welcome .om-layout { position: relative; flex: 1; overflow: hidden; }
  #screen-om-welcome .om-sidebar { position: absolute; top: 0; left: 0; bottom: 0; width: 220px; background: var(--color-bg-nav); border-right: 1px solid var(--color-border-default); padding: var(--space-4) 0; overflow-y: auto; }
  #screen-om-welcome .om-main { position: absolute; top: 0; left: 220px; right: 0; bottom: 0; overflow-y: auto; background: var(--color-bg-page); padding: var(--space-8); }
  #screen-om-welcome .welcome-hero { max-width: 560px; margin: var(--space-16) auto 0; text-align: center; }
  #screen-om-welcome .welcome-hero__greeting { font-size: var(--font-size-3xl); font-weight: var(--font-weight-bold); color: var(--color-text-primary); line-height: var(--line-height-tight); margin-bottom: var(--space-3); }
  #screen-om-welcome .welcome-hero__sub { font-size: var(--font-size-base); color: var(--color-text-secondary); margin-bottom: var(--space-8); line-height: var(--line-height-relaxed); }
  #screen-om-welcome .welcome-cta-row { display: flex; gap: var(--space-3); justify-content: center; }
  #screen-om-welcome .welcome-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-5); max-width: 560px; margin: var(--space-10) auto 0; }
  #screen-om-welcome .stat-card { background: var(--color-bg-surface); border: 1px solid var(--color-border-default); border-radius: var(--radius-lg); padding: var(--space-5); text-align: center; box-shadow: var(--shadow-xs); }
  #screen-om-welcome .stat-card__num { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); color: var(--color-primary-600); }
  #screen-om-welcome .stat-card__label { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: var(--space-1); font-weight: var(--font-weight-medium); text-transform: uppercase; letter-spacing: var(--tracking-wide); }
</style>

<div class="om-shell">
  <div class="ms-nav">
    <div class="ms-nav__utility">
      <a class="ms-logo">
        <img src="assets/agentsync-logo.png" width="32" height="32" alt="AgentSync" style="display:block">
      </a>
      <div class="ms-nav__search">
        <svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--color-text-muted);flex-shrink:0"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
        <input type="text" placeholder="Search Onboarding...">
      </div>
      <div class="ms-nav__icons">
        <div class="ms-nav__icon--combo" title="Favorites">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2l2.4 5 5.6.8-4 3.9.9 5.5L10 14.8l-4.9 2.4.9-5.5L2 7.8l5.6-.8z"/></svg>
          <svg width="9" height="9" viewBox="0 0 10 10" fill="currentColor"><path d="M2 3l3 4 3-4H2z"/></svg>
        </div>
        <div class="ms-nav__icon" title="New">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 4v12M4 10h12"/></svg>
        </div>
        <div class="ms-nav__icon" title="Notifications" style="position:relative">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2a6 6 0 016 6c0 3.5 1 5 1.5 6H2.5C3 13 4 11.5 4 8a6 6 0 016-6zm0 16a2 2 0 002-2H8a2 2 0 002 2z"/></svg>
          <span class="ms-nav__badge">4</span>
        </div>
        <div class="ms-nav__icon" title="Help">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="8"/><path d="M8 8a2 2 0 114 0c0 1.5-2 2-2 3.5M10 15.5v.5"/></svg>
        </div>
        <div class="ms-nav__icon" title="Setup">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
        <div class="ms-nav__avatar">JT</div>
      </div>
    </div>
    <div class="ms-nav__app">
      <div class="ms-nav__waffle">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="15" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/><rect x="15" y="8" width="5" height="5" rx="1"/><rect x="1" y="15" width="5" height="5" rx="1"/><rect x="8" y="15" width="5" height="5" rx="1"/><rect x="15" y="15" width="5" height="5" rx="1"/></svg>
      </div>
      <span class="ms-nav__appname">Onboarding</span>
      <div class="ms-nav__tabs">
        <div class="ms-nav__tab active" onclick="go('screen-om-welcome')">Accounts <span class="ms-nav__caret">▾</span></div>
        <div class="ms-nav__tab" onclick="go('screen-om-producers')">Producers <span class="ms-nav__caret">▾</span></div>
        <div class="ms-nav__tab" onclick="go('screen-om-tasks')">Tasks <span class="ms-nav__caret">▾</span></div>
      </div>
    </div>
  </div>

  <div class="om-layout">
    <div class="om-sidebar">
      <div class="sidebar__section-label">Navigation</div>
      <div class="nav-item" onclick="go('screen-om-producers')">
        <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="7" r="3"/><path d="M2 17c0-3.3 2.7-6 6-6h0m4 5l2 2 4-4"/></svg>
        Producers
      </div>
      <div class="nav-item" onclick="go('screen-om-tasks')">
        <svg class="nav-item__icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M7 10l2 2 4-4"/></svg>
        Tasks
      </div>
    </div>

    <div class="om-main">
      <div class="welcome-hero">
        <div class="welcome-hero__greeting">Welcome back, Jamie 👋</div>
        <div class="welcome-hero__sub">You're the Operating Manager for Globe Life Insurance. Use AgentSync to track your producers' onboarding progress and ensure everyone is sell-ready.</div>
        <div class="welcome-cta-row">
          <button class="btn btn--primary btn--lg" onclick="go('screen-om-producers')">View Producers</button>
          <button class="btn btn--secondary btn--lg" onclick="go('screen-om-invite-producer')">Invite Producer</button>
        </div>
      </div>
      <div class="welcome-stats">
        <div class="stat-card">
          <div class="stat-card__num">12</div>
          <div class="stat-card__label">Active Producers</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" style="color:var(--color-warning-600)">4</div>
          <div class="stat-card__label">Needs Attention</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__num" style="color:var(--color-success-600)">8</div>
          <div class="stat-card__label">Sell-Ready</div>
        </div>
      </div>
    </div>
  </div>
</div>
