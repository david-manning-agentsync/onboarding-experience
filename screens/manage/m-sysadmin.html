<!-- m-sysadmin.html — System Admin (Manage / SLDS theme) -->
<style>
  #screen-m-sysadmin .ms-shell {
    position: relative;
    height: calc(100vh - 44px);
    background: var(--color-bg-page);
    font-family: var(--font-family-base);
  }
  /* ── Two-row nav ── */
  #screen-m-sysadmin .ms-nav {
    position: absolute; top: 0; left: 0; right: 0; z-index: 200;
    background: var(--color-bg-surface);
    border-bottom: 1px solid var(--color-border-default);
    display: flex; flex-direction: column;
  }
  #screen-m-sysadmin .ms-nav__utility {
    display: flex; align-items: center;
    height: 40px; padding: 0 var(--space-medium); gap: var(--space-medium);
    border-bottom: 1px solid var(--color-border-default);
  }
  #screen-m-sysadmin .ms-nav__brand {
    font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
    color: var(--color-text-primary); white-space: nowrap; flex-shrink: 0;
  }
  #screen-m-sysadmin .ms-nav__search {
    flex: 1; max-width: 420px;
    display: flex; align-items: center;
    border: 1px solid var(--color-border-default);
    border-radius: 4px; height: 26px; padding: 0 var(--space-x-small);
    background: var(--color-bg-surface); gap: var(--space-xx-small);
  }
  #screen-m-sysadmin .ms-nav__search input {
    border: none; outline: none; font-family: var(--font-family-base);
    font-size: var(--font-size-sm); color: var(--color-text-primary);
    background: transparent; width: 100%;
  }
  #screen-m-sysadmin .ms-nav__search input::placeholder { color: var(--color-text-muted); }
  #screen-m-sysadmin .ms-nav__icons {
    display: flex; align-items: center; gap: var(--space-xx-small); margin-left: auto;
  }
  #screen-m-sysadmin .ms-nav__icon {
    width: 28px; height: 28px; display: flex; align-items: center;
    justify-content: center; cursor: pointer; border-radius: var(--radius-md);
    color: var(--color-gray-500); transition: background var(--transition-fast);
  }
  #screen-m-sysadmin .ms-nav__icon:hover { background: var(--color-gray-100); }
  #screen-m-sysadmin .ms-nav__avatar {
    width: 28px; height: 28px; border-radius: var(--radius-full);
    background: var(--color-brand-500); color: #fff;
    font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  #screen-m-sysadmin .ms-nav__app {
    display: flex; align-items: stretch; height: 36px;
    padding: 0 0 0 var(--space-x-small);
  }
  #screen-m-sysadmin .ms-nav__waffle {
    display: flex; align-items: center;
    color: var(--color-gray-500); flex-shrink: 0; cursor: pointer;
    padding: 0 var(--space-x-small);
  }
  #screen-m-sysadmin .ms-nav__appname {
    display: flex; align-items: center;
    font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
    color: var(--color-text-primary); white-space: nowrap; flex-shrink: 0;
    padding: 0 var(--space-medium) 0 var(--space-xx-small);
    border-right: 1px solid var(--color-border-default);
  }
  #screen-m-sysadmin .ms-nav__tabs {
    display: flex; align-items: stretch; height: 100%;
  }
  #screen-m-sysadmin .ms-nav__tab {
    display: flex; align-items: center; gap: 4px;
    padding: 0 var(--space-medium);
    font-size: var(--font-size-base); color: var(--color-text-secondary);
    cursor: pointer; white-space: nowrap;
    border-bottom: 3px solid transparent;
    transition: color var(--transition-fast);
  }
  #screen-m-sysadmin .ms-nav__tab:hover { color: var(--color-text-primary); }
  #screen-m-sysadmin .ms-nav__tab.active {
    color: var(--color-text-primary);
    border-bottom-color: var(--color-brand-500);
    font-weight: var(--font-weight-bold);
  }
  #screen-m-sysadmin .ms-nav__caret { font-size: 10px; color: var(--color-gray-400); }
  /* ── Body ── */
  #screen-m-sysadmin .ms-body {
    position: absolute; top: 76px; left: 0; right: 0; bottom: 0;
    overflow-y: auto; background: var(--color-bg-page);
  }
  #screen-m-sysadmin .ms-content {
    padding: var(--space-x-large) var(--space-x-large);
    max-width: 720px;
  }
  #screen-m-sysadmin .ms-welcome-heading {
    font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold);
    color: var(--color-text-primary); margin-bottom: var(--space-x-small);
  }
  #screen-m-sysadmin .ms-welcome-sub {
    font-size: var(--font-size-base); color: var(--color-text-secondary);
    margin-bottom: var(--space-x-large); line-height: var(--line-height-relaxed);
  }
  #screen-m-sysadmin .ms-quick-actions {
    display: flex; gap: var(--space-medium);
  }
  #screen-m-sysadmin .ms-action-card {
    flex: 1; max-width: 240px;
    background: var(--color-bg-surface);
    border: 1px solid var(--color-border-default);
    border-radius: var(--radius-md);
    padding: var(--space-large) var(--space-medium);
    text-align: center;
    cursor: pointer;
    transition: box-shadow var(--transition-fast), border-color var(--transition-fast);
  }
  #screen-m-sysadmin .ms-action-card:hover {
    border-color: var(--color-brand-500);
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  #screen-m-sysadmin .ms-action-card__icon {
    width: 40px; height: 40px; border-radius: var(--radius-md);
    background: var(--color-brand-500); color: #fff;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto var(--space-small);
  }
  #screen-m-sysadmin .ms-action-card__label {
    font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
  }
</style>

<div class="ms-shell">

        </div>
        <div class="ms-nav__avatar">JD</div>

    </div>
    <div class="ms-nav__app">
      <div class="ms-nav__waffle">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><rect x="1" y="1" width="5" height="5" rx="1"/><rect x="8" y="1" width="5" height="5" rx="1"/><rect x="15" y="1" width="5" height="5" rx="1"/><rect x="1" y="8" width="5" height="5" rx="1"/><rect x="8" y="8" width="5" height="5" rx="1"/><rect x="15" y="8" width="5" height="5" rx="1"/><rect x="1" y="15" width="5" height="5" rx="1"/><rect x="8" y="15" width="5" height="5" rx="1"/><rect x="15" y="15" width="5" height="5" rx="1"/></svg>

  <!-- Body -->
  <div class="ms-body">
