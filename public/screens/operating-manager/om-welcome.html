<!-- om-welcome.html — OM Accounts view (SFDC chrome, Onboarding app) -->
<style>
  #screen-om-welcome {
    --lv-border: var(--color-gray-300);
    --lv-icon-bg: #0176d3;
  }

  #screen-om-welcome .ms-shell {
    position: relative;
    height: calc(100vh - 44px);
    background: var(--color-gray-100);
    font-family: var(--font-family-base);
    display: flex;
    flex-direction: column;
  }

  /* ── Nav utility bar ── */
  #screen-om-welcome .ms-nav {
    flex-shrink: 0;
    background: var(--color-bg-surface);
    border-bottom: 1px solid var(--lv-border);
    display: flex; flex-direction: column; z-index: 200;
  }
  #screen-om-welcome .ms-nav__utility {
    display: flex; align-items: center;
    height: 50px; padding: 0 var(--space-medium); gap: var(--space-small);
    border-bottom: 1px solid var(--lv-border);
  }
  #screen-om-welcome .ms-logo { display: flex; align-items: center; gap: 8px; flex-shrink: 0; text-decoration: none; margin-right: 4px; }
  #screen-om-welcome .ms-nav__search {
    flex: 1; max-width: 480px; margin: 0 auto; height: 32px;
    display: flex; align-items: center;
    border: 1px solid var(--lv-border); border-radius: 4px;
    padding: 0 10px; gap: 6px; background: var(--color-bg-surface);
  }
  #screen-om-welcome .ms-nav__search input { flex: 1; border: none; outline: none; font-family: var(--font-family-base); font-size: var(--font-size-sm); color: var(--color-text-primary); background: transparent; }
  #screen-om-welcome .ms-nav__search input::placeholder { color: var(--color-text-muted); }
  #screen-om-welcome .ms-nav__icons { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
  #screen-om-welcome .ms-nav__icon {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px; cursor: pointer; color: var(--color-gray-600);
    transition: background var(--transition-fast); position: relative;
  }
  #screen-om-welcome .ms-nav__icon:hover { background: var(--color-gray-100); }
  #screen-om-welcome .ms-nav__icon--combo { display: flex; align-items: center; gap: 2px; padding: 0 4px; border-radius: 4px; cursor: pointer; color: var(--color-gray-600); }
  #screen-om-welcome .ms-nav__icon--combo:hover { background: var(--color-gray-100); }
  #screen-om-welcome .ms-nav__badge {
    position: absolute; top: 4px; right: 4px; width: 14px; height: 14px;
    background: var(--color-danger-base); color: #fff; font-size: 9px; font-weight: var(--font-weight-bold);
    border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center;
  }
  #screen-om-welcome .ms-nav__avatar {
    width: 32px; height: 32px; border-radius: var(--radius-full);
    background: var(--color-primary-600); color: #fff;
    font-size: var(--font-size-xs); font-weight: var(--font-weight-bold);
    display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: 4px;
  }

  /* ── App bar ── */
  #screen-om-welcome .ms-nav__app { display: flex; align-items: stretch; height: 44px; }
  #screen-om-welcome .ms-nav__waffle {
    display: flex; align-items: center; justify-content: center;
    width: 44px; flex-shrink: 0; color: var(--color-gray-600); cursor: pointer;
    border-right: 1px solid var(--lv-border);
  }
  #screen-om-welcome .ms-nav__appname {
    display: flex; align-items: center; font-size: var(--font-size-base); font-weight: var(--font-weight-bold);
    color: var(--color-text-primary); white-space: nowrap; padding: 0 var(--space-medium);
    border-right: 1px solid var(--lv-border); flex-shrink: 0;
  }
  #screen-om-welcome .ms-nav__tabs { display: flex; align-items: stretch; flex: 1; }
  #screen-om-welcome .ms-nav__tab {
    display: flex; align-items: center; gap: 3px; padding: 0 14px;
    font-size: var(--font-size-sm); color: var(--color-gray-600);
    cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent;
    transition: color var(--transition-fast); flex-shrink: 0;
  }
  #screen-om-welcome .ms-nav__tab:hover { color: var(--color-text-primary); }
  #screen-om-welcome .ms-nav__tab.active { color: var(--color-brand-500); border-bottom-color: var(--color-brand-500); font-weight: var(--font-weight-semibold); }
  #screen-om-welcome .ms-nav__caret { font-size: 9px; color: var(--color-gray-400); }
  #screen-om-welcome .ms-nav__tab.active .ms-nav__caret { color: var(--color-brand-300); }

  /* ── Body ── */
  #screen-om-welcome .ms-body {
    flex: 1; overflow-y: auto; padding: var(--space-medium);
    background: linear-gradient(160deg, #4673A5 0%, #B7C7DF 100%);
  }

  /* ── List View Card ── */
  #screen-om-welcome .lv-card { background: var(--color-bg-surface); border: 1px solid var(--lv-border); border-radius: 4px; overflow: hidden; }
  #screen-om-welcome .lv-card__header { display: flex; align-items: center; padding: 10px 16px; gap: var(--space-medium); border-bottom: 1px solid var(--lv-border); }
  #screen-om-welcome .lv-card__header-left { display: flex; align-items: center; gap: 10px; }
  #screen-om-welcome .lv-card__icon { width: 40px; height: 40px; border-radius: 6px; background: var(--lv-icon-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: #fff; }
  #screen-om-welcome .lv-card__object-name { font-size: var(--font-size-xs); color: var(--color-text-secondary); line-height: 1; margin-bottom: 2px; }
  #screen-om-welcome .lv-card__view-name { display: flex; align-items: center; gap: 4px; font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text-primary); cursor: pointer; }
  #screen-om-welcome .lv-card__view-caret { font-size: 12px; color: var(--color-gray-500); }
  #screen-om-welcome .lv-card__pin { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--lv-border); cursor: pointer; color: var(--color-gray-500); margin-left: 2px; }
  #screen-om-welcome .lv-card__pin:hover { background: var(--color-gray-100); }
  #screen-om-welcome .lv-card__header-right { display: flex; align-items: center; gap: var(--space-x-small); margin-left: auto; }
  #screen-om-welcome .lv-btn { height: 30px; padding: 0 12px; border-radius: 4px; font-size: var(--font-size-sm); font-family: var(--font-family-base); cursor: pointer; transition: background var(--transition-fast); white-space: nowrap; }
  #screen-om-welcome .lv-btn--outline { background: #fff; border: 1px solid var(--lv-border); color: var(--color-brand-500); }
  #screen-om-welcome .lv-btn--outline:hover { background: var(--color-brand-50); }
  #screen-om-welcome .lv-btn--neutral { background: #fff; border: 1px solid var(--lv-border); color: var(--color-text-primary); }
  #screen-om-welcome .lv-btn--neutral:hover { background: var(--color-gray-100); }

  /* ── Toolbar ── */
  #screen-om-welcome .lv-card__toolbar { display: flex; align-items: center; padding: 6px 16px; gap: var(--space-medium); border-bottom: 1px solid var(--lv-border); background: var(--color-bg-surface); }
  #screen-om-welcome .lv-meta { font-size: var(--font-size-sm); color: var(--color-text-secondary); flex: 1; }
  #screen-om-welcome .lv-toolbar-actions { display: flex; align-items: center; gap: 4px; }
  #screen-om-welcome .lv-search-wrap { position: relative; display: inline-flex; align-items: center; }
  #screen-om-welcome .lv-search-wrap svg { position: absolute; left: 7px; color: var(--color-text-muted); pointer-events: none; }
  #screen-om-welcome .lv-search { height: 28px; border: 1px solid var(--lv-border); border-radius: 4px; padding: 0 8px 0 28px; font-family: var(--font-family-base); font-size: var(--font-size-sm); color: var(--color-text-primary); background: var(--color-bg-surface); outline: none; width: 200px; }
  #screen-om-welcome .lv-icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 4px; border: 1px solid var(--lv-border); background: #fff; color: var(--color-gray-600); cursor: pointer; transition: background var(--transition-fast); }
  #screen-om-welcome .lv-icon-btn:hover { background: var(--color-gray-100); }

  /* ── Table (SFDC style — this is the outer Accounts/firm view) ── */
  #screen-om-welcome table { width: 100%; border-collapse: collapse; }
  #screen-om-welcome thead tr { background: var(--color-gray-100); border-bottom: 1px solid var(--lv-border); }
  #screen-om-welcome th { padding: 0 12px; height: 32px; text-align: left; font-size: var(--font-size-xs); font-weight: var(--font-weight-semibold); color: var(--color-gray-600); white-space: nowrap; border-right: 1px solid var(--lv-border); user-select: none; }
  #screen-om-welcome th:last-child { border-right: none; }
  #screen-om-welcome .th-num { width: 36px; text-align: right; color: var(--color-text-muted); border-right: 1px solid var(--lv-border); padding-right: 8px; }
  #screen-om-welcome .th-chk { width: 40px; text-align: center; padding: 0; }
  #screen-om-welcome .th-sort { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  #screen-om-welcome .th-sort:hover { color: var(--color-brand-500); }
  #screen-om-welcome .sort-caret { font-size: 9px; color: var(--color-gray-400); }
  #screen-om-welcome tbody tr { border-bottom: 1px solid var(--lv-border); transition: background var(--transition-fast); }
  #screen-om-welcome tbody tr:last-child { border-bottom: none; }
  #screen-om-welcome tbody tr:hover { background: var(--color-gray-100); }
  #screen-om-welcome td { padding: 0 12px; height: 44px; vertical-align: middle; font-size: var(--font-size-sm); color: var(--color-text-primary); border-right: 1px solid var(--lv-border); }
  #screen-om-welcome td:last-child { border-right: none; }
  #screen-om-welcome .td-num { text-align: right; padding-right: 8px; color: var(--color-text-muted); font-size: var(--font-size-xs); width: 36px; }
  #screen-om-welcome .td-chk { width: 40px; text-align: center; padding: 0; }
  #screen-om-welcome .td-link { color: var(--color-brand-500); cursor: pointer; }
  #screen-om-welcome .td-link:hover { text-decoration: underline; }
  #screen-om-welcome .td-action { width: 36px; text-align: center; padding: 0; }
  #screen-om-welcome .row-action-btn { width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--lv-border); border-radius: 3px; background: #fff; color: var(--color-gray-600); cursor: pointer; font-size: 10px; line-height: 1; }
  #screen-om-welcome .row-action-btn:hover { background: var(--color-gray-100); }

  #screen-om-welcome .pill { display: inline-flex; align-items: center; padding: 0 8px; height: 20px; border-radius: var(--radius-full); border: 1px solid; font-size: var(--font-size-xs); font-weight: var(--font-weight-bold); white-space: nowrap; }
  #screen-om-welcome .pill--active { background: #f2fbf2; border-color: var(--color-success-base); color: var(--color-success-base); }
  #screen-om-welcome .pill--warning { background: #fef7e6; border-color: var(--color-warning-base); color: var(--color-warning-dark); }
</style>

<div class="ms-shell">

  <!-- ── NAV ── -->
