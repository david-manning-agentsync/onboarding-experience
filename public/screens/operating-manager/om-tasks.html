<!-- om-tasks.html — Task list (OB chrome + OB task table with inline drawers) -->
<style>
  /* ════════════════════════════════════════════════════
     Figma Visual Alignment — om-tasks screen
     ════════════════════════════════════════════════════ */

  /* Topnav — HorizonTrust wordmark */
  #screen-om-tasks .coo-topnav__logo-text {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #1c64b0;
  }

  /* Sidebar section label */
  #screen-om-tasks .coo-sidebar__label {
    color: rgba(0,0,0,0.6);
    font-size: var(--font-size-sm);
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Sidebar nav items */
  #screen-om-tasks .coo-nav-item {
    height: 44px;
    border-radius: 6px;
    padding: 0 9px;
    font-size: 15px;
    font-weight: 400;
    color: rgba(0,0,0,0.6);
  }
  #screen-om-tasks .coo-nav-item.active {
    background: #f5f5f5;
    color: rgba(0,0,0,0.87);
    font-weight: 700;
  }
  #screen-om-tasks .coo-nav-item:hover {
    background: var(--color-gray-100);
    color: rgba(0,0,0,0.87);
  }

  /* Page header */
  #screen-om-tasks .pt-header__title {
    font-weight: var(--font-weight-semibold);
    color: rgba(0,0,0,0.87);
  }
  #screen-om-tasks .pt-header__subtitle {
    font-size: 14px;
    color: rgba(0,0,0,0.6);
    font-weight: 400;
  }

  /* ─── Hero toolbar ─── */
  #screen-om-tasks .toolbar-default {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--color-border-default);
  }
  #screen-om-tasks .pt-search-wrap {
    flex: 1;
    max-width: 600px;
    position: relative;
    display: flex;
    align-items: center;
  }
  #screen-om-tasks .pt-search-wrap svg {
    position: absolute;
    left: 12px;
    pointer-events: none;
  }
  #screen-om-tasks .pt-search {
    flex: 1;
    width: 100%;
    height: 44px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    padding: 0 12px 0 36px;
    font-size: var(--font-size-base);
    color: var(--color-text-primary);
    background: var(--color-bg-surface);
    outline: none;
  }
  #screen-om-tasks .pt-search:focus {
    box-shadow: 0 0 0 3px var(--color-primary-100);
    border-color: var(--color-primary-400);
  }

  /* ─── Ghost secondary buttons ─── */
  #screen-om-tasks .pt-ghost-btn {
    height: 40px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    background: none;
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-family-base);
    white-space: nowrap;
  }
  #screen-om-tasks .pt-ghost-btn:hover {
    background: var(--color-gray-100);
    border-color: var(--color-border-default);
  }

  /* Table — MUI DataGrid proportions */
  #screen-om-tasks .ob-table-wrap th {
    height: 52px;
  }
  #screen-om-tasks .ob-table-wrap td {
    height: 56px;
  }

  /* Task drawer — override manage-chrome.css flex layout for detail panel */
  #screen-om-tasks .task-drawer-inner {
    display: block;
    padding: 0;
  }
  /* Drawer rows should have no min-height constraint */
  #screen-om-tasks .task-drawer-row td {
    height: auto;
    padding: 0;
  }
</style>

<div class="coo-shell">
  <div data-component="ob-topnav" data-screen="om-tasks"></div>
  <div class="coo-layout">
    <div data-component="ob-sidebar" data-screen="om-tasks"></div>
    <div class="coo-main">
      <div class="pt-header">
        <div class="pt-header__titles">
          <h1 class="pt-header__title">Tasks</h1>
          <p class="pt-header__subtitle">Summit Agency Group · Spring 2026 Onboarding</p>
        </div>
      </div>
      <div data-component="ob-task-table" data-screen="om-tasks"></div>
    </div>
  </div>
</div>
