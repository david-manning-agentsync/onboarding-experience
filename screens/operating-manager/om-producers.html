<!-- om-producers.html — Producers list (OB chrome + OB table) -->
<style>
  /* ════════════════════════════════════════════════════
     Figma Visual Alignment — om-producers screen
     ════════════════════════════════════════════════════ */

  /* Topnav — HorizonTrust wordmark */
  #screen-om-producers .coo-topnav__logo-text {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #1c64b0;
  }

  /* Sidebar section label */
  #screen-om-producers .coo-sidebar__label {
    color: rgba(0,0,0,0.6);
    font-size: var(--font-size-sm);
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
  }

  /* Sidebar nav items */
  #screen-om-producers .coo-nav-item {
    height: 44px;
    border-radius: 6px;
    padding: 0 9px;
    font-size: 15px;
    font-weight: 400;
    color: rgba(0,0,0,0.6);
  }
  #screen-om-producers .coo-nav-item.active {
    background: #f5f5f5;
    color: rgba(0,0,0,0.87);
    font-weight: 700;
  }
  #screen-om-producers .coo-nav-item:hover {
    background: var(--color-gray-100);
    color: rgba(0,0,0,0.87);
  }

  /* Page header */
  #screen-om-producers .pt-header__title {
    font-weight: var(--font-weight-semibold);
    color: rgba(0,0,0,0.87);
  }
  #screen-om-producers .pt-header__subtitle {
    font-size: 14px;
    color: rgba(0,0,0,0.6);
    font-weight: 400;
  }

  /* ─── Hero toolbar ─── */
  #screen-om-producers .toolbar-default {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--color-border-default);
  }
  #screen-om-producers .pt-search-wrap {
    flex: 1;
    max-width: 600px;
    position: relative;
    display: flex;
    align-items: center;
  }
  #screen-om-producers .pt-search-wrap svg {
    position: absolute;
    left: 12px;
    pointer-events: none;
  }
  #screen-om-producers .pt-search {
    flex: 1;
    width: 100%;
    height: 44px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-md);
    padding: 0 12px 0 36px;
    font-size: var(--font-size-base);
    color: var(--color-text-primary);
    background: var(--color-bg-surface);
    outline: none;
  }
  #screen-om-producers .pt-search:focus {
    box-shadow: 0 0 0 3px var(--color-primary-100);
    border-color: var(--color-primary-400);
  }

  /* ─── Ghost secondary buttons ─── */
  #screen-om-producers .pt-ghost-btn {
    height: 40px;
    padding: 0 12px;
    border: 1px solid transparent;
    border-radius: var(--radius-md);
    background: none;
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-family-base);
    white-space: nowrap;
  }
  #screen-om-producers .pt-ghost-btn:hover {
    background: var(--color-gray-100);
    border-color: var(--color-border-default);
  }

  /* ─── Toolbar swap: hide default when selection active ─── */
  #screen-om-producers .ob-table-wrap.has-selection .toolbar-default {
    display: none;
  }

  /* ─── Action bar layout redesign ─── */
  #screen-om-producers .ob-action-bar {
    background: var(--color-primary-600);
    min-height: 53px;
    padding: 0 20px;
    gap: 12px;
  }
  #screen-om-producers .ob-action-bar__count {
    color: #fff;
    font-weight: 400;
  }
  #screen-om-producers .ob-action-bar__clear {
    background: none;
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: var(--radius-sm);
    color: rgba(255,255,255,0.8);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    font-family: var(--font-family-base);
    padding: 3px 10px;
    cursor: pointer;
    margin-left: 0;
  }
  #screen-om-producers .ob-action-bar__clear:hover {
    color: #fff;
    border-color: rgba(255,255,255,0.7);
  }
  #screen-om-producers .ob-action-bar__cta {
    margin-left: auto;
    background: #fff;
    color: var(--color-primary-600);
    border: none;
    padding: 6px 16px;
    border-radius: var(--radius-md);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    font-family: var(--font-family-base);
    cursor: pointer;
  }
  #screen-om-producers .ob-action-bar__cta:hover {
    background: rgba(255,255,255,0.9);
  }

  /* ─── Selected row tint ─── */
  #screen-om-producers .ob-table-wrap tr.row-selected td {
    background: var(--color-primary-50, #e8f0fe);
  }

  /* Table — MUI DataGrid proportions */
  #screen-om-producers .ob-table-wrap th {
    height: 52px;
  }
  #screen-om-producers .ob-table-wrap td {
    height: 56px;
  }
</style>

<div class="coo-shell">
  <div data-component="ob-topnav" data-screen="om-producers"></div>
  <div class="coo-layout">
    <div data-component="ob-sidebar" data-screen="om-producers"></div>
    <div class="coo-main">
      <div class="pt-header">
        <div class="pt-header__titles">
          <h1 class="pt-header__title">Producers</h1>
          <p class="pt-header__subtitle">Summit Agency Group · Spring 2026 Onboarding</p>
        </div>
        <button class="btn btn--primary" onclick="openInviteDrawer()">+ Invite Producer</button>
      </div>
      <div data-component="ob-table" data-screen="om-producers"></div>
    </div>
  </div>
</div>
